unbind C-b
set-option -g prefix `
bind-key ` send-prefix
# split panes using | and -
bind \\ split-window -h
bind - split-window -v
unbind '"'
unbind %
# vim motions for pane movements
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# mouse
set -g mouse on

set -g default-terminal "xterm-256color"
bind-key ! break-pane -d -n _hidden_pane
bind-key @ join-pane -vs $.0
# set -g @plugin 'tmux-plugins/tmux-yank'
# run '~/.tmux/plugins/tpm/tpm'
##### Basics
set -g mode-keys vi                 # vi-style keys in copy mode
set -g mouse on                     # optional: drag to select/scroll
set -s set-clipboard on             # tmux ↔ system clipboard (tmux ≥3.2)
set -sg escape-time 10
set -wg scroll-on-clear off
set -wg window-size smallest
set -as terminal-overrides ',*:indn@'

##### Clipboard bindings (requires xclip)
# Suppress errors when DISPLAY is not available (e.g., SSH without X11)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard 2>/dev/null || true"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard 2>/dev/null || true"
bind-key -T copy-mode-vi v send-keys -X begin-selection
set -gq allow-passthrough on
set -g visual-activity off
