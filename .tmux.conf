# Change prefix to Ctrl-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# split panes using | and -
bind \\ split-window -h
bind - split-window -v
unbind '"'
unbind %

# yazi: vertsplit and popup
bind Y split-window -h yazi
bind C-y display-popup -E -w 80% -h 80% yazi
# ccdash: live dashboard of all Claude Code sessions
# prefix G = quick popup overlay; prefix g = jump into a persistent "ccdash" session
#   (attach-or-create), press g again to bounce back to where you were.
bind-key G display-popup -E -w 90% -h 85% -e COLORTERM=truecolor "uv run --script $HOME/repo/ccmonitor/ccdash.py"
bind-key g if-shell -F '#{==:#{session_name},ccdash}' { switch-client -l } { if-shell 'tmux has-session -t ccdash 2>/dev/null' { switch-client -t ccdash } { new-session -d -s ccdash -n monitor "uv run --script $HOME/repo/ccmonitor/ccdash.py" ; switch-client -t ccdash } }
# vim motions for pane movements
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Swap pane with its neighbor in that direction; if already at that edge
# (no neighbor to swap with), fall back to moving it there as a full
# edge column/row.
bind H if -F '#{pane_at_left}'   { join-pane -h -b -f -t '{next}' } { swap-pane -t '{left-of}' }
bind J if -F '#{pane_at_bottom}' { join-pane -v -f -t '{next}' }    { swap-pane -t '{down-of}' }
bind K if -F '#{pane_at_top}'    { join-pane -v -b -f -t '{next}' } { swap-pane -t '{up-of}' }
bind L if -F '#{pane_at_right}'  { join-pane -h -f -t '{next}' }    { swap-pane -t '{right-of}' }

# Kill pane without confirmation
bind x kill-pane

# mouse
set -g mouse on

set -g default-terminal "tmux-256color"
bind-key ! break-pane -d -n _hidden_pane
bind-key @ join-pane -hs $.0
bind-key B run-shell 'wins=$(tmux list-windows -F "##I:##W" | tr "\n" "|" | sed "s/|$//; s/|/ | /g"); tmux command-prompt -I "##{@pane_name}" -p "[$wins] New name:" "break-pane -d -n \"%%\""'
bind-key M run-shell 'wins=$(tmux list-windows -F "##I:##W" | tr "\n" "|" | sed "s/|$//; s/|/ | /g"); tmux command-prompt -p "[$wins] Join from:" "run-shell \"$HOME/dotfiles/tmux-join-pane.sh %%\""'
# Swap current pane with a visually-selected window (inline choose-tree, like prefix s).
# _popup_* navigator sessions are filtered out (same filter as prefix P).
bind-key S choose-tree -Zw \
  -f '#{?#{m:_popup_*,#{session_name}},0,1}' \
  "run-shell -b \"$HOME/dotfiles/tmux-swap-pane.sh '%%'\""
bind-key N run-shell 'wins=$(tmux list-windows -F "##I:##W" | tr "\n" "|" | sed "s/|$//; s/|/ | /g"); tmux command-prompt -p "[$wins] Name for new shell:" "run-shell \"$HOME/dotfiles/tmux-new-swap-pane.sh %%\""'
bind-key D run-shell 'wins=$(tmux list-windows -F "##I:##W" | tr "\n" "|" | sed "s/|$//; s/|/ | /g"); wid=$(tmux display-message -p "#{window_id}"); wname=$(tmux display-message -p "#W"); tmux command-prompt -I "$wname" -p "[$wins] Break to session:" "run-shell \"$HOME/dotfiles/tmux-break-session.sh %% $wid\""'
bind-key P if -F '#{m:_popup_*,#{session_name}}' { detach-client } { run-shell '$HOME/dotfiles/tmux-tree-popup.sh' }
# Popup into a dedicated, persistent "claude" session (attach-or-create); toggle off with C again
bind-key C if -F '#{==:#{session_name},claude}' { detach-client } { display-popup -E -w 80% -h 80% "tmux new-session -A -s claude" }
# Headless Claude diagnosis of THIS pane's last command output. Popup shows
# the answer; [f] drops a suggested fix onto this pane's prompt (no Enter
# sent — reviewed before running). Overrides tmux's default `select-layout
# -E` (spread panes evenly), kept deliberately: unused/uncustomized here.
# run-shell hop: tmux 3.4 doesn't format-expand display-popup's shell-command
# (3.5 does), so #{pane_id} must be expanded by run-shell at keypress time.
bind-key e run-shell -b 'tmux display-popup -E -w 80% -h 80% "$HOME/dotfiles/tmux-claude-explain.sh \"#{pane_id}\" \"#{pane_current_path}\""'
# Fork the Claude Code conversation running in THIS pane into a sibling pane
# (prefix+X) or a new window (prefix+C-x). Pure tmux -> no round trip through
# Claude, which is what the fork-conversation-pane skill costs.
# pane -> session ID is a lookup in ~/.claude/sessions/<pid>.json (Claude Code
# >= 2.1.235 records "tmux":"<sess>:@<win>.%<pane>" there itself).
# The pane id must be passed explicitly: run-shell format-expands #{pane_id},
# but unlike the Bash tool it does NOT put TMUX_PANE in the child's environment.
bind-key X run-shell -b '$HOME/dotfiles/tmux-fork-claude.sh "#{pane_id}"'
bind-key C-x run-shell -b '$HOME/dotfiles/tmux-fork-claude.sh "#{pane_id}" -W'
# Keep THIS pane's Claude conversation for posterity, under ~/conversations.
#   prefix A   = name it and say why it is worth keeping (popup editor), then copy
#   prefix C-a = fzf over what you kept; Enter resumes one in a new window
# Same pane -> session lookup as prefix X above: ccsave shells out to
# tmux-fork-claude.sh --resolve rather than reimplementing it.
# The popup is created by the *binding*, not inside ccsave, because a
# display-popup issued from run-shell returns immediately instead of waiting for
# the editor to exit -- ccsave would copy before you finished typing the name.
# The trailing `; true` keeps tmux's own "returned 1" notice from overwriting
# ccsave's status-line message: ccsave reports its own failures, and holds the
# popup open on the ones worth reading.
bind-key A run-shell -b 'tmux display-popup -E -w 80% -h 60% -T " ccsave " "$HOME/dotfiles/bin/ccsave \"#{pane_id}\"" ; true'
bind-key C-a display-popup -E -w 85% -h 80% -T " kept conversations " "$HOME/dotfiles/bin/ccfind"
# Rename window with a blank prompt (no need to backspace the current name)
bind-key , command-prompt -p "Rename window:" "rename-window -- '%%'"
# The rename family, prefilled with the current name so a small edit is a small edit:
#   r = window (same as `,` above, but not blank), R = session, M-r = pane.
# `R` was unbound (tmux binds no uppercase R at prefix); `r` was the pane-name
# prompt, demoted to M-r because @pane_name is the least-used of the three -- the
# pane border shows ACTIVE, not the name, so its only reader is status-right.
# Window/session both already have a default key (`,` and `$`); these are the
# prefilled twins, not replacements.
bind-key r command-prompt -I "#W" -p "Rename window:" "rename-window -- '%%'"
bind-key R command-prompt -I "#S" -p "Rename session:" "rename-session -- '%%'"
bind-key M-r command-prompt -I "#{@pane_name}" -p "Pane name:" "set -p @pane_name '%%'"
bind y copy-mode
##### Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '15'
##### Basics
set -g mode-keys vi                 # vi-style keys in copy mode
# Pinned, because tmux otherwise infers it from the EDITOR/VISUAL of whatever process
# started the *server* -- and that is normally `bin/sb-up` over ssh, a non-interactive
# shell where Ubuntu's .bashrc early-exits before .bash_vars exports EDITOR. So the
# inference silently landed on emacs and every session attaching to that server got it.
# In the vi prompt: C-u clears the line (measured -- it works here too, though the man
# page lists it only under emacs), Escape d does the same, and cancel is C-c or Escape q
# -- bare Escape only leaves insert mode, and a bare q types a `q`.
set -g status-keys vi               # command prompt only; copy mode is mode-keys above
set -g mouse on                     # optional: drag to select/scroll
set -s set-clipboard on             # tmux ↔ system clipboard (tmux ≥3.2)
set -sg escape-time 10
set -wg scroll-on-clear off
set -wg window-size smallest
set -as terminal-overrides ',*:indn@'

# Ghostty supports true colour, but tmux only EMITS 24-bit to the outer terminal when the
# feature is declared -- otherwise it quantises to the 256 palette. yazi's Kitty-graphics
# adapter (Kgp) places images with U+10EEEE placeholder cells whose 24-bit FOREGROUND
# encodes the image ID, so without this tmux destroys the ID and image preview renders
# nothing at all, silently. Client features are cached at attach: re-attach after editing.
set -as terminal-features ',*:RGB'

# EDITOR into the *server* environment, mirroring .bash_vars:2. A pane started as a
# COMMAND rather than a shell -- `tmux split-window "claude --resume ..."`, which is how
# fork-pane.sh:184/188 spawn a forked Claude, and every `trun` job -- is run
# non-interactively, so Ubuntu's .bashrc early-exits before .bash_vars and the only
# EDITOR left is whatever the server was born with. That is usually nothing, because
# bin/sb-up starts the server over ssh (see status-keys above). Claude Code then falls
# through its ["code","vi","nano"] probe to `vi`, which on Ubuntu is an alternatives
# symlink to vim.basic -- so Ctrl-G opened vim in forked panes but nvim in typed ones.
# Interactive panes are unaffected: their .bashrc sets the same value anyway.
set-environment -g EDITOR nvim

##### Clipboard bindings (requires xclip)
# Suppress errors when DISPLAY is not available (e.g., SSH without X11)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard 2>/dev/null || true"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard 2>/dev/null || true"
bind-key -T copy-mode-vi v send-keys -X begin-selection

set -gq allow-passthrough on
set-option -g focus-events on
set -g visual-activity off
set-option -g update-environment "DISPLAY WAYLAND_DISPLAY XAUTHORITY"
# yazi-recommended: propagate TERM/TERM_PROGRAM into panes
set -ga update-environment "TERM TERM_PROGRAM"

##### Status line styling (replaces tmux-dotbar: left-aligned windows + Claude "needs you" segment)
set -g status-justify left
set -g status-interval 15           # nothing dynamic in the status line anymore
set -g status-style 'fg=colour250,bg=colour237'
set -g status-left ' #S '
set -g status-left-style 'fg=colour250,bg=colour237'
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W '
set -g window-status-current-style 'fg=colour16,bg=colour255,bold'
set -g window-status-style 'fg=colour250,bg=default'
set -g window-status-separator '  '
# Right: pane name only. The ccmonitor/ccbar.py segment that used to live here was removed —
# its path was tesu's absolute `/home/jeffk/...`, and the claim that a missing file is
# "harmless on macOS, #() yields empty" was wrong: tmux surfaces the interpreter's error in
# the status line, and it re-ran on every status-interval tick.
set -g status-right-length 100
set -g status-right ' #{@pane_name} '
set -g status-right-style 'fg=colour255'

##### Active/inactive pane distinction
# `window-style` recolors only the cells an application left at default fg/bg, so
# it reaches nvim solely because nvim keeps a transparent background (catppuccin
# `transparent_background = true`, nvim/init.lua). An opaque colorscheme paints
# every cell itself and the pane stays undimmed no matter what is set here --
# measured on a pty capture of an inactive pane: opaque `Normal` forwarded nvim's
# own background and none of these colors, `Normal bg=NONE` emitted them
# throughout. Full-color TUIs that paint their own background (yazi, lazygit) are
# undimmable for the same reason; Claude Code panes dim because they don't.
# The dim must stay on the *same side* of light/dark as the terminal theme, and not
# because of taste: tmux answers an OSC 11 background query for an inactive pane
# out of this style rather than forwarding it to the terminal (measured -- an
# inactive pane replies `rgb:1212/1212/1212` for bg=colour233, an active one with
# `bg=terminal` gets forwarded). So this color is what every auto-theming app in
# an inactive pane believes the terminal to be: a dark dim under a light terminal
# flips nvim and Claude Code (`"theme": "auto"`) into dark mode.
# Within that constraint, dim by shading rather than bleaching. The old
# fg=colour245,bg=colour253 was #8a8a8a on #dadada -- 2.5:1, which reads as a
# white haze over the pane. colour252 (#d0d0d0) is a clearly grayer field that is
# still unambiguously "light" to a luminance test, and colour242 (#6c6c6c) keeps
# text at ~3.5:1: muted next to the active pane's near-black on white, but crisp.
set -g window-style 'fg=colour242,bg=colour252'
set -g window-active-style 'fg=terminal,bg=terminal'
set -g pane-border-style 'fg=colour238'
# Active border turns yellow while the prefix key is held (client_prefix).
set -g pane-active-border-style '#{?client_prefix,fg=colour226,fg=colour39}'
# Border label on the ACTIVE pane only, top-left. `pane-border-format` is evaluated
# per pane, so the `pane_active` conditional is the whole mechanism: the active pane
# renders the label, every other pane expands to empty and draws a plain border.
# The label text is deliberately not the pane name -- status-right already shows
# `#{@pane_name}` for the current pane, so a name here would be the same fact twice.
# Position is fixed at 2 cells in from the pane's left edge; `#[align=right]` is
# honoured too (measured on 3.4), but "right" means that *pane's* right edge, which
# for a left-hand pane is the middle of the screen, not the window corner.
set -g pane-border-status off
set -g pane-border-format '#{?pane_active,#[fg=colour39#,bold] ACTIVE #[default],}'
# The border steals a row even from a window with a single pane, where it labels the
# only thing on screen. Hence global `off` above plus this hook, rather than the
# obvious global `top`: a brand-new never-split window does NOT fire
# window-layout-changed (measured), so a hook that only flips *off* at one pane would
# miss it and leak the wasted row. Defaulting off and switching *on* at 2+ panes
# covers new windows, splits, kill-pane, and break-pane alike.
set-hook -g window-layout-changed 'if -F "#{==:#{window_panes},1}" "set -w pane-border-status off" "set -w pane-border-status top"'

##### Nested session support (F12 toggles outer tmux off)
# Dim the status bar at the SESSION level on enter; `set -u` on exit reverts to the
# global (configured) values above — no plugin re-run needed.
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style 'fg=colour244,bg=colour234' \;\
  set window-status-current-style 'fg=colour250,bg=colour238,bold' \;\
  refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u window-status-current-style \;\
  refresh-client -S

set -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

##### ccmonitor — auto-start in dedicated session
# Only start ccmonitor when the script actually exists (it lives on the Linux box at
# /home/jeffk/...). Without the -f guard, macOS spawns a ccmonitor session whose pane
# dies instantly on every cold start because the path doesn't exist here.
if-shell '! tmux has-session -t ccmonitor 2>/dev/null && [ -f /home/jeffk/repo/ccmonitor/claude_status.py ]' \
  'new-session -d -s ccmonitor -n monitor "python3 /home/jeffk/repo/ccmonitor/claude_status.py"'

set-option -g allow-rename off

set-option -g default-shell /bin/bash

# Initialize TPM (must be last line)
set -g @plugin 'schasse/tmux-jump'
set -g @jump-key 'f'
# Ensure Homebrew bins are on PATH before TPM runs. The server may be started with a
# minimal launchd PATH (macOS GUI/login launch) that lacks /usr/local/bin, which makes
# TPM's bare `tmux`/`git` calls fail so plugins silently never load until a manual reload.
# Prepends both Intel (/usr/local/bin) and Apple-Silicon (/opt/homebrew/bin) brew dirs;
# harmless on Linux (those dirs simply don't exist and are ignored).
run-shell 'PATH="/opt/homebrew/bin:/usr/local/bin:$PATH" tmux set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:$PATH"'
run '~/.tmux/plugins/tpm/tpm'
